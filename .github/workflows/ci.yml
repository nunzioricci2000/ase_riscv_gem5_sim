# SPDX-License-Identifier: GPL-2.0-only
# Created in the personal fork on 2026-10-27: fast Gitflow pull-request checks.
# Modified in the personal fork on 2026-10-27: target personal main/develop branches and check runtime patch application.
# Modified in the personal fork on 2026-10-30: allow reviewed upstream proposals to be checked by explicit dispatch.
name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Gitflow and regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 ci/gitflow.py check
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - run: python3 utils/test_patch_gem5.py
      - run: python3 utils/test_installation.py
      - run: python3 utils/test_benchmark_installation.py
      - name: Check whitespace and shell syntax
        run: |
          git diff --check
          bash -n ci/steps.sh ci/gem5-launcher.sh
