# Created in the personal fork on 2026-10-27: validate existing engine artifacts without rebuilding Linux.
name: Validate existing package on WSL
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing engine-ubuntu-24.04-x86_64
        required: true
        default: '40506734225'
permissions:
  contents: read
  actions: read
jobs:
  windows-wsl:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-ubuntu-24.04-x86_64
          path: artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Validate relocated SDK
        shell: pwsh
        run: ./ci/wsl-test.ps1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsl-validation
          path: ${{ runner.temp }}/ase-wsl-report/
          if-no-files-found: warn
          retention-days: 14
