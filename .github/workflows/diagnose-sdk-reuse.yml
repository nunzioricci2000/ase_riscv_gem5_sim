# SPDX-License-Identifier: GPL-2.0-only
# Created in the personal fork on 2026-10-28: isolate SDK reuse phases without compiling on a cache miss.
# Modified in the personal fork on 2026-10-28: isolate the remaining Ubuntu 22.04 reuse check after the Debian fix passed.
# Modified in the personal fork on 2026-10-28: inspect Fedora environment and reuse phases while the final matrix continues.
# Modified in the personal fork on 2026-10-28: inspect complete SDK/build-tool ELF closures and development files without changing production reuse policy.
name: Diagnose existing SDK reuse
on:
  push:
    branches: [fix/diagnose-sdk-reuse]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET: fedora-43-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the disposable Fedora environment
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p "$RUNNER_TEMP/probe-work" "$RUNNER_TEMP/probe-output" "$RUNNER_TEMP/probe-cache"
          docker run --detach --name ase-reuse-probe \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/probe-work,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/probe-output,dst=/output" \
            --mount "type=bind,src=$RUNNER_TEMP/probe-cache,dst=/cache" \
            -e ASE_REPO=/repo -e ASE_WORK=/work -e ASE_OUTPUT=/output -e ASE_CACHE=/cache \
            -e ASE_TARGET="$TARGET" -e ASE_FAMILY=fedora -e ASE_ARCH=x86_64 \
            -e BUILD_JOBS=2 -e ASE_PROFILE=full -e GEM5_LINKER=default \
            fedora:43 sleep infinity
      - name: Install the build environment and compute component identities
        timeout-minutes: 5
        run: |
          docker exec ase-reuse-probe bash /repo/ci/steps.sh dependencies
          docker exec ase-reuse-probe bash /repo/ci/steps.sh environment
      - name: Retain environment evidence before any SDK transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reuse-probe-inputs
          path: ${{ runner.temp }}/probe-output/
          retention-days: 14
      - name: Download a verified previous SDK for dependency analysis
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/diagnose_fedora_sdk.py prepare "$RUNNER_TEMP/probe-output" "$RUNNER_TEMP/probe-work/reuse"
      - name: Inspect SDK and build-tool dependencies and changed package contents
        timeout-minutes: 5
        run: docker exec ase-reuse-probe python3 /repo/ci/diagnose_fedora_sdk.py inspect /output /work/reuse
      - name: Test the previous SDK with the current system libraries
        timeout-minutes: 5
        run: |
          docker exec ase-reuse-probe python3 /repo/ci/package.py test-bundle "/work/previous-sdk/ase-engine-$TARGET"
          docker exec ase-reuse-probe "/work/previous-sdk/ase-engine-$TARGET/toolchain/bin/riscv64-unknown-elf-gdb" -nx -batch -ex 'show configuration'
          docker exec -e "LD_LIBRARY_PATH=/work/previous-sdk/ase-engine-$TARGET/python/lib" ase-reuse-probe \
            "/work/previous-sdk/ase-engine-$TARGET/python/bin/python3.10" -c \
            'import ctypes, hashlib, readline, sqlite3, ssl, uuid; assert uuid.uuid1().version == 1; assert uuid.uuid4().version == 4; assert sqlite3.connect(":memory:").execute("select 42").fetchone() == (42,); print(ssl.OPENSSL_VERSION)'
      - name: Record partial archive sizes and clean up the disposable container
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'probe-output'
          output.mkdir(exist_ok=True)
          sizes = {p.name: p.stat().st_size for p in output.iterdir() if p.is_file()}
          (output / 'file-sizes.json').write_text(json.dumps(sizes, indent=2) + '\n')
          PY
          docker rm --force ase-reuse-probe || true
      - name: Retain diagnostics without another copy of binary/source archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reuse-probe-result
          path: |
            ${{ runner.temp }}/probe-output/
            !${{ runner.temp }}/probe-output/*.tar.gz
            !${{ runner.temp }}/probe-output/*.partial
          retention-days: 14
